spring:
  application:
    name: control-bff
  config:
    import: "optional:vault://secret/waver/${waver.env:local}/control-bff"
  cloud:
    vault:
      uri: ${VAULT_ADDR:http://localhost:8200}
      token: ${VAULT_TOKEN:}
      kv:
        enabled: true
        backend: secret
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: waver-control-bff
            client-secret: ${keycloak.client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/waver}
  session:
    timeout: 30m
    data:
      redis:
        namespace: "waver:sess:control-bff"   # Redis ACL: control-bff may only touch waver:sess:control-bff:* (ADR-0020)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      username: control-bff
      password: ${redis.password}

server:
  port: 8081
  forward-headers-strategy: framework   # edge-gateway sets X-Forwarded-*; redirect URIs use the public host
  servlet:
    session:
      cookie:
        name: WAVER_CONTROL_SESSION
        http-only: true
        same-site: lax

waver:
  security:
    resource-server: false              # a BFF is an OAuth client, not a resource server
  services:
    tenant-service: ${TENANT_SERVICE_URL:http://localhost:8091}
    audit-service: ${AUDIT_SERVICE_URL:http://localhost:8092}
    reseller-service: ${RESELLER_SERVICE_URL:http://localhost:8094}
    catalog-service: ${CATALOG_SERVICE_URL:http://localhost:8096}
    marketplace-service: ${MARKETPLACE_SERVICE_URL:http://localhost:8097}

management:
  endpoints:
    web:
      exposure:
        include: health,info
