# WAVER local infrastructure (Phase 0). Development only: secrets come from .env generated by deploy/local/init.py.
# Core: PostgreSQL, Keycloak, Redis, Vault, Kafka, Apicurio, Kafka Connect/Debezium, Temporal, Mailpit.
# Kubernetes environments (dev/staging/prod) use Helm charts, Istio and Vault Kubernetes auth instead (RFC-0014/0015).
name: waver

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:18
    environment:
      POSTGRES_USER: waver_admin
      POSTGRES_PASSWORD: ${WAVER_DB_PASSWORD}
      WAVER_DB_PASSWORD: ${WAVER_DB_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical          # Debezium outbox (ADR-0024)
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=1GB # cap WAL retained by a stalled slot (RFC-0007)
      - -c
      - max_connections=200        # one pool per service (10 each) plus Keycloak, Apicurio and Debezium
    ports: ["5433:5432"]   # 5433 on the host: a native PostgreSQL often owns 5432 on dev machines
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waver_admin"]
      interval: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 768m } } }

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${WAVER_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: kc-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: organization
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx640m
    ports: ["8180:8180"]
    volumes:
      - ./keycloak/generated:/opt/keycloak/data/import:ro
      - ./keycloak/themes/waver:/opt/keycloak/themes/waver:ro
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 1g } } }

  redis:
    <<: *restart
    image: redis:8.8
    command: ["redis-server", "--aclfile", "/usr/local/etc/redis/users.acl", "--appendonly", "no"]
    ports: ["6379:6379"]
    volumes:
      - ./redis/generated/users.acl:/usr/local/etc/redis/users.acl:ro
    deploy: { resources: { limits: { memory: 256m } } }

  vault:
    <<: *restart
    image: hashicorp/vault:2.2
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]
    deploy: { resources: { limits: { memory: 256m } } }

  kafka:
    <<: *restart
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared (RFC-0006)
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["9092:9092"]
    deploy: { resources: { limits: { memory: 900m } } }

  apicurio:
    <<: *restart
    image: apicurio/apicurio-registry:3.3.3
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: apicurio
      APICURIO_DATASOURCE_PASSWORD: ${WAVER_DB_PASSWORD}
      APICURIO_CCOMPAT_LEGACY_ID_MODE_ENABLED: "false"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m
    ports: ["8085:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 640m } } }

  kafka-connect:
    <<: *restart
    image: quay.io/debezium/connect:3.7.0.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: waver-connect
      CONFIG_STORAGE_TOPIC: waver.connect.configs
      OFFSET_STORAGE_TOPIC: waver.connect.offsets
      STATUS_STORAGE_TOPIC: waver.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["8083:8083"]
    depends_on: [kafka, postgres]
    deploy: { resources: { limits: { memory: 900m } } }

  temporal:
    <<: *restart
    image: temporalio/temporal:1.9.1
    # Dev server with a SQLite file, so onboarding workflows survive a restart (ADR-0023).
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db",
              "--namespace", "waver-commercial", "--namespace", "waver-platform", "--namespace", "waver-agent"]
    user: "0:0"
    ports: ["7233:7233", "8233:8233"]
    volumes:
      - temporaldata:/data
    deploy: { resources: { limits: { memory: 512m } } }

  # SMTP sink for local e-mail (Keycloak invitations, notification-service later). UI on http://localhost:8025.
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.31.3
    ports: ["8025:8025", "1025:1025"]
    deploy: { resources: { limits: { memory: 128m } } }

volumes:
  pgdata:
  temporaldata:
